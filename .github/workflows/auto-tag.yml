name: Auto tag master

on:
  push:
    branches: [master]

permissions:
  contents: write

jobs:
  tag:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Create next patch tag
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          # Se o commit já tem uma tag de versão (release manual), não cria outra.
          # O próximo push na master incrementa a partir dessa tag.
          existing="$(git tag --points-at "$GITHUB_SHA" --list 'v[0-9]*' | head -n 1)"
          if [ -n "$existing" ]; then
            echo "Commit $GITHUB_SHA already tagged as $existing; nothing to do."
            exit 0
          fi

          latest="$(git tag --list 'v[0-9]*' --sort=-v:refname | head -n 1)"
          if [ -z "$latest" ]; then
            next="v1.0.0"
          else
            version="${latest#v}"
            IFS='.' read -r major minor patch <<< "$version"
            next="v${major}.${minor}.$((patch + 1))"
          fi

          if git rev-parse "$next" >/dev/null 2>&1; then
            echo "Tag $next already exists; nothing to do."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "$next" -m "Release $next" "$GITHUB_SHA"
          git push origin "$next"
          echo "Created $next for commit $GITHUB_SHA"
